      - name: Run native Unix store adapter and identity tests
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" && "$(uname -m)" != "arm64" ]]; then
            echo "The native Unix store adapter qualification requires a macOS arm64 runner."
            exit 1
          fi
          if [[ "${{ matrix.os }}" == "ubuntu-24.04-arm" && "$(uname -m)" != "aarch64" ]]; then
            echo "The Linux arm64 lane must execute natively on arm64."
            exit 1
          fi

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            native_shim=$(find test/Nuplane.Store.Tests/bin/Release -type f -name libnuplane_store_native.dylib -print -quit)
            if [[ -z "${native_shim}" ]]; then
              echo "The project-reference build did not copy libnuplane_store_native.dylib to the Store test output."
              exit 1
            fi
          fi

          dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj \
            --configuration Release \
            --filter "(FullyQualifiedName~Nuplane.Store.Tests.Coordination.UnixPhysicalStoreFileSystemTests|FullyQualifiedName~Nuplane.Store.Tests.Coordination.UnixPhysicalStoreIdentityTests|FullyQualifiedName~Nuplane.Store.Tests.Coordination.UnixPhysicalStorePublicationTests)&FullyQualifiedName!~Ext4Casefold" \
            --logger "trx;LogFileName=native-unix.trx" \
            --results-directory "$RUNNER_TEMP/native-unix-results"

          python3 - "$RUNNER_TEMP/native-unix-results/native-unix.trx" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          counters = root.find('.//{*}Counters')
          if counters is None:
              raise SystemExit('Native qualification returned no test counters.')
          total = int(counters.get('total', '0'))
          passed = int(counters.get('passed', '0'))
          if total < 19 or passed != total:
              raise SystemExit(f'Native qualification requires every test to pass without skips: {counters.attrib}')
          names = {r.get('testName') for r in root.findall('.//{*}UnitTestResult') if r.get('outcome') == 'Passed'}
          required = {
              'NativeChildOpen_RefusesFinalLinksWithoutManagedPreInspection',
              'ObserveStateSlot_UsesFilesystemSpellingAndNameProfileForAliases',
              'ObserveStateSlot_ParentAliasesConvergeAndAtomicReplacePreservesSlot',
              'ObserveCanonicalFileNameNoFollow_RejectsWrongIdentityLinksAndForeignHandles',
              'NativeNoReplace_RefusesOccupiedTargetWithoutManagedPreInspection',
              'Publish_ReplacesExistingSlotAndPreservesItsIdentity',
              'Remove_RequiresExactRegularSingleLinkIdentity',
              'Publish_RefusesAliasSpellingForeignAndClosedParents',
          }
          if not all(any(n.endswith('.' + expected) for n in names) for expected in required):
              raise SystemExit('The Unix state-slot identity scenarios did not all execute and pass.')
          PY

      - name: Qualify ext4 casefold aliases on an owned loopback filesystem
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          set -euo pipefail
          owned_root=$(mktemp -d "$RUNNER_TEMP/nuplane-casefold.XXXXXX")
          image="$owned_root/store.ext4"
          mount_root="$owned_root/mount"
          mkdir "$mount_root"
          cleanup() {
            if mountpoint -q "$mount_root"; then
              sudo umount "$mount_root"
            fi
          }
          trap cleanup EXIT
          truncate -s 256M "$image"
          mkfs.ext4 -q -F -O casefold -E encoding=utf8-12.1 "$image"
          sudo mount -o loop,nosuid,nodev,noexec "$image" "$mount_root"
          sudo chown "$(id -u):$(id -g)" "$mount_root"
          TMPDIR="$mount_root" NUPLANE_REQUIRE_EXT4_CASEFOLD=1 \
            dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj \
            --configuration Release --no-build --no-restore \
            --filter "FullyQualifiedName~UnixPhysicalStoreIdentityTests.ObserveStateSlot_Ext4Casefold|FullyQualifiedName~UnixPhysicalStorePublicationTests.Publish_Ext4CasefoldAliasesRequireCanonicalNames|FullyQualifiedName~UnixPhysicalStoreDirectoryPublicationTests.Publish_Ext4CasefoldAliasIsObservedButOnlyCanonicalNameCanMove|FullyQualifiedName~RootMembershipBindingTests.BindDeclaredMembersAsync_Ext4CasefoldAliasPublishesObservedCanonicalSpelling|FullyQualifiedName~PackageStoreAuthorityResolverTests.Resolve_Ext4CasefoldDirectorySpellingFindsNativeAliasAndReservedAuthority|FullyQualifiedName~PackageInstallIdentityReaderTests.Observe_UsesNativeCasefoldProfileForReservedAliasesAndRetainsOrdinaryAliasSpelling|FullyQualifiedName~PackageInstallIdentityReaderTests.Revalidate_RefusesAnInstallRenamedIntoAReservedNativeAlias|FullyQualifiedName~PackageStoreAdmissionProspectiveRootTests.ConfiguredRootAdmissionRefusesExt4CasefoldAliasOfReservedControlName|FullyQualifiedName~PackageDirectoryAllowMissingSuffixTests.Resolve_OnExt4Casefold_RefusesUnicodeAliasOfReservedControlName|FullyQualifiedName~UnixPhysicalStoreDirectoryEnumerationTests.EnumerateChildNamesNoFollow_Ext4CasefoldPreservesExactStoredUnicodeSpelling|FullyQualifiedName~NativePackageInstallSessionTests.AcquireAsync_Ext4CasefoldRejectsSharedParentAliasBeforePublication" \
            --logger "trx;LogFileName=casefold.trx" \
            --results-directory "$RUNNER_TEMP/casefold-results"
          python3 - "$RUNNER_TEMP/casefold-results/casefold.trx" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          rows = root.findall('.//{*}UnitTestResult')
          required = {'AcquireAsync_Ext4CasefoldRejectsSharedParentAliasBeforePublication', 'EnumerateChildNamesNoFollow_Ext4CasefoldPreservesExactStoredUnicodeSpelling', 'Resolve_OnExt4Casefold_RefusesUnicodeAliasOfReservedControlName', 'BindDeclaredMembersAsync_Ext4CasefoldAliasPublishesObservedCanonicalSpelling', 'ConfiguredRootAdmissionRefusesExt4CasefoldAliasOfReservedControlName', 'ObserveStateSlot_Ext4CasefoldResolvesCaseAndNormalizationAliases', 'Observe_UsesNativeCasefoldProfileForReservedAliasesAndRetainsOrdinaryAliasSpelling', 'Publish_Ext4CasefoldAliasIsObservedButOnlyCanonicalNameCanMove', 'Publish_Ext4CasefoldAliasesRequireCanonicalNames', 'Resolve_Ext4CasefoldDirectorySpellingFindsNativeAliasAndReservedAuthority', 'Revalidate_RefusesAnInstallRenamedIntoAReservedNativeAlias'}
          if len(rows) != 11 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('All eleven required native ext4 casefold scenarios must execute and pass without skips.')
          if not all(any(row.get('testName', '').endswith('.' + name) for row in rows) for name in required):
              raise SystemExit('The required ext4 casefold identity/file/directory publication/binding/authority/install scenarios did not all execute.')
          PY

      - name: Run native Windows store adapter tests on Windows x64 NTFS
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') {
            throw 'Native Windows store qualification requires a Windows x64 runner.'
          }
          $temporaryDrive = [System.IO.DriveInfo]::new([System.IO.Path]::GetPathRoot([System.IO.Path]::GetTempPath()))
          if ($temporaryDrive.DriveFormat -ne 'NTFS') {
            throw 'Native Windows store qualification requires the owned test temporary root to reside on NTFS.'
          }

          $results = Join-Path $env:RUNNER_TEMP 'native-windows-results'
          dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj `
            --configuration Release `
            --filter 'FullyQualifiedName~Nuplane.Store.Tests.Coordination.WindowsPhysicalStoreFileSystemTests|FullyQualifiedName~Nuplane.Store.Tests.Coordination.WindowsPhysicalStorePublicationTests|FullyQualifiedName~Nuplane.Store.Tests.Coordination.WindowsReparseTargetParserTests' `
            --logger 'trx;LogFileName=native-windows.trx' `
            --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          [xml]$report = Get-Content (Join-Path $results 'native-windows.trx') -Raw
          $counters = $report.SelectSingleNode('//*[local-name()="Counters"]')
          if ($null -eq $counters) { throw 'Native Windows qualification returned no test counters.' }
          $total = [int]$counters.total
          $passed = [int]$counters.passed
          if ($total -lt 19 -or $passed -ne $total) {
            throw "Native Windows qualification requires every test to pass without skips: $($counters.OuterXml)"
          }
          $rows = @($report.SelectNodes('//*[local-name()="UnitTestResult"]'))
          foreach ($name in @(
            'NativeNoReplace_RefusesOccupiedTargetWithoutManagedPreInspection',
            'Publish_ReplacesExistingSlotAndPreservesItsIdentity',
            'Remove_RequiresExactRegularSingleLinkIdentity',
            'Publish_RefusesAliasSpellingForeignAndClosedParents'
          )) {
            $matched = @($rows | Where-Object { $_.testName.EndsWith('.' + $name) -and $_.outcome -eq 'Passed' })
            if ($matched.Count -ne 1) { throw "The required native publication scenario did not execute and pass: $name" }
          }

      - name: Run native Windows state-slot identity tests
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = Join-Path $env:RUNNER_TEMP 'identity-windows-results'
          dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj `
            --configuration Release `
            --filter 'FullyQualifiedName~Nuplane.Store.Tests.Coordination.WindowsPhysicalStoreIdentityTests' `
            --logger 'trx;LogFileName=identity-windows.trx' `
            --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          [xml]$report = Get-Content (Join-Path $results 'identity-windows.trx') -Raw
          $rows = @($report.SelectNodes('//*[local-name()="UnitTestResult"]'))
          $required = @(
            'StateSlotObservation_UsesStoredCaseAndNativeCaseInsensitiveProfile',
            'StateSlotObservation_CaseSensitiveDirectoryKeepsCaseVariantsDistinct',
            'StateSlotObservation_RefusesWrongIdentityReparseAndHardLinkEntries',
            'CanonicalNameObservation_RequiresTheOwnedParentHandleToRemainOpen',
            'StateSlotObservation_AtomicReplacementKeepsSlotButChangesFileIdentityAndRenameChangesSlot'
          )
          foreach ($name in $required) {
            $matched = @($rows | Where-Object { $_.testName.EndsWith('.' + $name) -and $_.outcome -eq 'Passed' })
            if ($matched.Count -ne 1) { throw "The required native identity scenario did not execute and pass: $name" }
          }
          $aliasName = '.StateSlotObservation_8Dot3AliasResolvesToTheStoredLongBasenameWhenEnabled'
          $alias = @($rows | Where-Object { $_.testName.EndsWith($aliasName) })
          if ($alias.Count -ne 1 -or $alias[0].outcome -notin @('Passed', 'NotExecuted')) {
            throw 'The 8.3 alias scenario must either pass or report an explicit capability skip.'
          }
          if (@($rows | Where-Object { $_.outcome -ne 'Passed' -and -not $_.testName.EndsWith($aliasName) }).Count -ne 0) {
            throw 'Only the optional 8.3 alias capability scenario may be skipped.'
          }
          if ($alias[0].outcome -eq 'NotExecuted') {
            Write-Host '8.3 aliases are unavailable on this test volume; that scenario remains unqualified.'
          }

  build-test:
    needs:
      - darwin-native-shim
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download verified Darwin native shim
        uses: actions/download-artifact@v4
        with:
          name: nuplane-darwin-native
          path: ${{ github.workspace }}/artifacts/nuplane-darwin-native

      - name: Set Darwin native shim directory for project-reference builds
        shell: bash
        run: echo "NuplaneDarwinNativeDirectory=$GITHUB_WORKSPACE/artifacts/nuplane-darwin-native" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore nuplane.sln

      - name: Build
        run: dotnet build nuplane.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test nuplane.sln --configuration Release --no-restore --no-build

      - name: Verify Darwin assets survive Linux packaging
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/Nuplane/Nuplane.csproj --configuration Release --no-build \
            -p:PackageVersion=0.0.0-ci.native --output artifacts/validation-packages
          python3 - <<'PY'
          import hashlib
          import pathlib
          import zipfile
          source = pathlib.Path('artifacts/nuplane-darwin-native/libnuplane_store_native.dylib')
          expected = hashlib.sha256(source.read_bytes()).digest()
          package = pathlib.Path('artifacts/validation-packages/Nuplane.0.0.0-ci.native.nupkg')
          with zipfile.ZipFile(package) as archive:
              for rid in ('osx-arm64', 'osx-x64'):
                  asset = f'runtimes/{rid}/native/libnuplane_store_native.dylib'
                  if hashlib.sha256(archive.read(asset)).digest() != expected:
                      raise SystemExit(f'Packaged native asset differs: {asset}')
          PY
