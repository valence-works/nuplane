name: Validate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  darwin-native-shim:
    name: Build universal Darwin store shim
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build and verify universal native shim
        shell: bash
        run: bash native/nuplane-store/build-darwin.sh "$RUNNER_TEMP/nuplane-darwin-native"

      - name: Upload verified native shim
        uses: actions/upload-artifact@v4
        with:
          name: nuplane-darwin-native
          path: |
            ${{ runner.temp }}/nuplane-darwin-native/libnuplane_store_native.dylib
            ${{ runner.temp }}/nuplane-darwin-native/nuplane-store-native.manifest.json
          if-no-files-found: error

  state-persistence-platform:
    name: State persistence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Verify protection serialization and canonical digests on every supported framework
        shell: bash
        run: |
          set -euo pipefail
          for framework in net8.0 net9.0 net10.0; do
            dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj \
              --configuration Release -p:NuplaneProtectionFrameworkMatrix=true --framework "$framework" \
              --filter "FullyQualifiedName~ProtectionStateSerializationTests|FullyQualifiedName~ProtectionStatePayloadSerializerTests|FullyQualifiedName~ProtectionDigestTests|FullyQualifiedName~RootMembershipPayloadSerializerTests" \
              --logger "trx;LogFileName=protection-$framework.trx" \
              --results-directory "$RUNNER_TEMP/protection-results/$framework"
          done

      - name: Run coordinated native ledger publication and recovery tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj \
            --configuration Release --framework net10.0 \
            --filter "FullyQualifiedName~RootMembershipRegistryTests|FullyQualifiedName~PhysicalStoreLockTests|FullyQualifiedName~PhysicalStoreLockOrderingTests" \
            --logger "trx;LogFileName=coordinated-publication.trx" \
            --results-directory "$RUNNER_TEMP/coordinated-publication"
          python3 - "$RUNNER_TEMP/coordinated-publication/coordinated-publication.trx" <<'PYCODE'
          import sys
          import xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          rows = ET.parse(sys.argv[1]).findall('.//t:UnitTestResult', ns)
          required = [
              'PublishStateAsync_AllPriorBranches_ReopensActualNativePayloadAndAcknowledgesNewIdentity',
              'RecoverAsync_DurablePendingBeforeArtifacts_ExactPriorRollsBackAndRemainsIncomplete',
              'RecoverAsync_BoundArtifactsBeforeReplacement_ExactPriorRollsBackAndRemovesOnlyBoundFiles',
              'RecoverAsync_ReplacedAndVerifiedSeams_ExactNextAcknowledgesReopenedStagedIdentity',
              'RecoverAsync_UnboundArtifactOrChangedBoundBackup_RefusesAndPreservesPendingEvidence',
              'RecoverAsync_ThirdOrMissingState_RefusesWithoutChangingLedgerOrArtifacts',
              'RecoverAsync_CompletePrior_RestoresStatusOnlyAfterEveryMemberReopensCorrectly',
              'PublishStateAsync_AnotherMembersMissingStateOrParent_RefusesBeforePendingPublication',
              'PublishStateAsync_SerializerDropsProtectionOnActualStageReopen_PreservesPendingAndPrior',
              'PublishStateAsync_DurableResolutionAndCleanupSeams_RecoverWithoutUnreferencedBackups',
              'RecoverAsync_PriorCleanupInterruptedBetweenRemovals_ResumesExactPriorAndRetainsSibling',
              'RecoverAsync_UnresolvedMissingBoundArtifact_RefusesBeforeDurableCleanupSelection',
              'RecoverAsync_ResolvedPriorChangedStageOrBackup_ValidatesAllArtifactsBeforeAnyRemoval',
              'RecoverAsync_ResolvedNextChangedStateOrSibling_RefusesAndKeepsBackup',
              'PublishStateAsync_CompletePrior_AcknowledgesOnlyAfterCleanupAndAllMembersValidate',
              'RecoverAsync_BackupChangesAfterStageRemoval_RevalidatesPayloadBeforeRemovingBackup',
              'RecoverAsync_CancelAfterFirstRemoval_RetainsDurableResolutionForFreshRecovery',
              'RecoverAsync_SelectedStateChangesAfterStageRemoval_RetainsExactPriorBackup',
              'AcquireAsync_SortsMemberLocksAndReleasesInReverseOrder',
              'AcquireAsync_CancellationAfterFirstMemberUnwindsAndLeavesEveryLockReusable',
              'AcquireBootstrapAsync_PreparesUnderRootCreatesMissingLocksAndAcquiresSorted',
              'AcquireBootstrapAsync_BusyLaterMemberUnwindsAndRetryReusesProvisionedLockFiles',
              'AcquireBootstrapAsync_CancellationAfterFirstMemberUnwindsAndRetryReusesCreatedLocks',
              'AcquireBootstrapAsync_CallbackFailureReleasesRootWithoutProvisioningMembers',
              'AcquireBootstrapAsync_CallbackCancellationReleasesRootWithoutProvisioningMembers',
              'AcquireBootstrapAsync_DuplicatePreparedSlotsFailBeforeMemberProvisioning',
          ]
          if len(rows) < 37 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('Coordinated native publication/lock scenarios must execute without skips.')
          for name in required:
              if sum(row.get('testName', '').endswith('.' + name) for row in rows) != 1:
                  raise SystemExit('Missing coordinated scenario: ' + name)
          PYCODE

      - name: Qualify initial incomplete declaration and native prospective-slot profiles
        shell: bash
        run: |
          set -euo pipefail
          dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj \
            --configuration Release --framework net10.0 \
            --filter "FullyQualifiedName~RootMembershipInitializationTests|FullyQualifiedName~PhysicalStoreDirectoryNameSemanticsTests" \
            --logger "trx;LogFileName=initial-declaration.trx" \
            --results-directory "$RUNNER_TEMP/initial-declaration"
          python3 - "$RUNNER_TEMP/initial-declaration/initial-declaration.trx" <<'PYCODE'
          import sys
          import xml.etree.ElementTree as ET
          rows = ET.parse(sys.argv[1]).findall('.//{*}UnitTestResult')
          required = [
              'Observe_EmptyParentCreatesNothingAndMatchesCanonicalFileObservation',
              'Observe_RejectsForeignAndClosedParentHandles',
              'InitializeIncomplete_PublishesEveryDeclaredTargetAndRootLockBeforeMemberStateIo',
              'InitializeIncomplete_PreconditionRefusalDoesNotMutateTheRootOrMemberStateParents',
              'InitializeIncomplete_PresentFinalWithMissingLedgerIsPreserved',
              'InitializeIncomplete_PresentFinalWithMalformedLedgerIsPreserved',
              'InitializeIncomplete_CancellationOrFaultBeforeMoveRetainsStageAndLeavesFinalAbsent',
              'InitializeIncomplete_ExceptionAfterMoveLeavesExactValidIncompleteDeclaration',
              'InitializeIncomplete_CompetingPublishersCannotOverwriteWinnerAndRetainLosingStage',
          ]
          if len(rows) != 9 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('All nine initial declaration/profile scenarios must execute and pass without skips.')
          for name in required:
              if sum(row.get('testName', '').endswith('.' + name) for row in rows) != 1:
                  raise SystemExit('Missing initial declaration/profile scenario: ' + name)
          PYCODE

      - name: Qualify incomplete declared-member binding before state payload reads
        shell: bash
        run: |
          set -euo pipefail
          dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj \
            --configuration Release --framework net10.0 \
            --filter "FullyQualifiedName~RootMembershipBindingTests&FullyQualifiedName!~Ext4Casefold" \
            --logger "trx;LogFileName=declared-member-binding.trx" \
            --results-directory "$RUNNER_TEMP/declared-member-binding"
          python3 - "$RUNNER_TEMP/declared-member-binding/declared-member-binding.trx" <<'PYCODE'
          import sys
          import xml.etree.ElementTree as ET
          rows = ET.parse(sys.argv[1]).findall('.//{*}UnitTestResult')
          required = [
              'BindDeclaredMembersAsync_BindsOrderedUnionAfterLocksAndPreservesStateSlots',
              'BindDeclaredMembersAsync_PreconditionMismatchesPreserveDeclaration',
              'BindDeclaredMembersAsync_DuplicateActualSlotsRefuseBeforeMemberLockProvisioning',
              'BindDeclaredMembersAsync_ProtectedOrMalformedPriorStateRemainsDeclared',
              'BindDeclaredMembersAsync_RereadsLedgerAfterAllLocksBeforeDecodingMemberPayload',
              'BindDeclaredMembersAsync_StateReplacementAfterAllLocksRefusesBeforePayloadDecode',
              'BindDeclaredMembersAsync_FaultOrCancellationBeforePublishLeavesAllMembersDeclared',
              'BindDeclaredMembersAsync_ExceptionAfterPublicationLeavesWholeBoundUnionIncomplete',
              'BindDeclaredMembersAsync_BusyLastSortedMemberLockRefusesAndCanRetry',
              'BindDeclaredMembersAsync_DoesNotAdoptDigestValidMismatchedOrAlreadyBoundLedger',
          ]
          if len(rows) != 10 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('All ten incomplete binding scenarios must execute and pass without skips.')
          for name in required:
              if sum(row.get('testName', '').endswith('.' + name) for row in rows) != 1:
                  raise SystemExit('Missing or duplicate incomplete binding scenario: ' + name)
          PYCODE

      - name: Qualify actual process incomplete member binding interruption
        shell: bash
        run: |
          set -euo pipefail
          dotnet test test/Nuplane.Integration.Tests/Nuplane.Integration.Tests.csproj \
            --configuration Release --framework net10.0 \
            --filter "FullyQualifiedName~RootMembershipBindingProcessTests" \
            --logger "trx;LogFileName=binding-process.trx" \
            --results-directory "$RUNNER_TEMP/binding-process"
          python3 - "$RUNNER_TEMP/binding-process/binding-process.trx" <<'PYCODE'
          import sys
          import re
          import xml.etree.ElementTree as ET
          rows = ET.parse(sys.argv[1]).findall('.//{*}UnitTestResult')
          if len(rows) != 2 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('Both incomplete binding process interruption cases must execute and pass without skips.')
          for point in ['BindingsPrepared', 'BoundLedgerPublished']:
              matches = [row for row in rows
                         if '.BindProcess_TerminationPreservesDeclaredOrWholeBoundIncompleteLedger(' in row.get('testName', '')
                         and re.findall(r'"([^"]+)"', row.get('testName', '')) == [point]]
              if len(matches) != 1:
                  raise SystemExit('Missing or duplicate incomplete binding process checkpoint: ' + point)
          PYCODE

      - name: Qualify actual process initial declaration interruption
        shell: bash
        run: |
          set -euo pipefail
          dotnet test test/Nuplane.Integration.Tests/Nuplane.Integration.Tests.csproj \
            --configuration Release --framework net10.0 \
            --filter "FullyQualifiedName~RootMembershipInitializationProcessTests" \
            --logger "trx;LogFileName=initial-declaration-process.trx" \
            --results-directory "$RUNNER_TEMP/initial-declaration-process"
          python3 - "$RUNNER_TEMP/initial-declaration-process/initial-declaration-process.trx" <<'PYCODE'
          import sys
          import re
          import xml.etree.ElementTree as ET
          rows = ET.parse(sys.argv[1]).findall('.//{*}UnitTestResult')
          if len(rows) != 2 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('Both initial declaration process interruption cases must execute and pass without skips.')
          for point in ['DeclarationPrepared', 'ControlPublished']:
              matches = [row for row in rows
                         if '.InitializeProcess_TerminationLeavesAbsentFinalOrExactIncompleteDeclaration(' in row.get('testName', '')
                         and re.findall(r'"([^"]+)"', row.get('testName', '')) == [point]]
              if len(matches) != 1:
                  raise SystemExit('Missing or duplicate initial declaration process checkpoint: ' + point)
          PYCODE

      - name: Qualify actual process publication and cleanup recovery
        shell: bash
        run: |
          set -euo pipefail
          dotnet test test/Nuplane.Integration.Tests/Nuplane.Integration.Tests.csproj \
            --configuration Release --framework net10.0 \
            --filter "FullyQualifiedName~RootMembershipRegistryProcessTests|FullyQualifiedName~PackageStoreParticipantProcessTests" \
            --logger "trx;LogFileName=membership-process.trx" \
            --results-directory "$RUNNER_TEMP/membership-process"
          python3 - "$RUNNER_TEMP/membership-process/membership-process.trx" <<'PYCODE'
          import sys
          import re
          import xml.etree.ElementTree as ET
          rows = ET.parse(sys.argv[1]).findall('.//{*}UnitTestResult')
          if len(rows) != 33 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('All 28 publisher cases, recovery restart case and four gate cases must pass without skips.')
          publisher = [r.get('testName', '') for r in rows if '.PublisherProcess_CheckpointsRecoverOrPreserveExactEvidenceAcrossAllPriorBindings(' in r.get('testName', '')]
          shapes = ['Prospective', 'ExistingUnprotected', 'Acknowledged']
          points = ['PendingPublished', 'StageFlushed', 'BackupFlushed', 'ArtifactsBound', 'StatePublished',
                    'StateVerified', 'ResolutionPublished', 'BackupRemoved', 'ArtifactsRemoved', 'Acknowledged']
          pairs = [re.findall(r'"([^"]+)"', name)[:2] for name in publisher]
          if len(publisher) != 28:
              raise SystemExit('The actual publisher checkpoint matrix did not execute all 28 cases.')
          for shape in shapes:
              for point in points:
                  if shape == 'Prospective' and point in ['BackupFlushed', 'BackupRemoved']:
                      continue
                  if pairs.count([shape, point]) != 1:
                      raise SystemExit('Missing or duplicate publisher case: ' + shape + '/' + point)
          required = ['RecoveryProcesses_CrashAfterPriorStageAndNextBackupRemoval_ResumeWithFreshOwner',
                      'ReleaseAsync_AfterReadiness_CapturesSuccessfulChildExit',
                      'DisposeAsync_BeforeRelease_TerminatesOwnedChildAndIsIdempotent',
                      'ReleaseAsync_WhenCancelled_LeavesGateWaitingUntilOwnedTermination',
                      'StartAsync_WhenAlreadyCancelled_DoesNotStartAChild']
          for name in required:
              if sum(row.get('testName', '').endswith('.' + name) for row in rows) != 1:
                  raise SystemExit('Missing process ownership/recovery case: ' + name)
          PYCODE

      - name: Qualify prepared directory no-replace publication
        shell: bash
        run: |
          set -euo pipefail
          common="FullyQualifiedName~Nuplane.Store.Tests.Coordination.PhysicalStoreDirectoryPublicationTests"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            native="FullyQualifiedName~WindowsPhysicalStoreDirectoryPublicationTests"
          else
            native="(FullyQualifiedName~UnixPhysicalStoreDirectoryPublicationTests&FullyQualifiedName!~Ext4Casefold)"
          fi
          dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj \
            --configuration Release --framework net10.0 \
            --filter "$common|$native" \
            --logger "trx;LogFileName=directory-publication.trx" \
            --results-directory "$RUNNER_TEMP/directory-publication"
          python3 - "$RUNNER_TEMP/directory-publication/directory-publication.trx" "$RUNNER_OS" <<'PYCODE'
          import sys
          import xml.etree.ElementTree as ET
          rows = ET.parse(sys.argv[1]).findall('.//{*}UnitTestResult')
          required = [
              'Publish_PopulatedDirectoryPreservesChildIdentitiesAndContents',
              'Publish_OccupiedDirectoryFileOrLinkPreservesAllEvidence',
              'Publish_RejectsWrongIdentityRegularFileAndDirectoryLink',
              'Publish_RequiresCanonicalSpellingAndRefusesDestinationAliases',
              'Publish_UsesNativeUnicodeSpellingAndRefusesNormalizationAliases',
              'Publish_RefusesForeignClosedParentsAndInvalidComponents',
              'Publish_SecondPublisherCannotOverwriteWinnerAndRetainsLosingStage',
              'NativeNoReplace_RefusesOccupiedDirectoryWithoutManagedPreinspection',
              'Publish_RefusesOpenStagedDescendantAndSucceedsAfterItCloses' if sys.argv[2] == 'Windows'
                  else 'Publish_UsesHeldParentAfterItsTextualNameIsReplaced',
          ]
          if len(rows) != 9 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('All nine native directory publication scenarios must execute and pass without skips.')
          for name in required:
              if sum(row.get('testName', '').endswith('.' + name) for row in rows) != 1:
                  raise SystemExit('Missing native directory publication scenario: ' + name)
          PYCODE

      - name: Run atomic state and registry tests
        run: dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj --configuration Release --filter "FullyQualifiedName~StoreRegistryTests.PersistActiveVersions_WhenSaveFails|FullyQualifiedName~StoreRegistryTests.PersistFailure_WhenSaveFails|FullyQualifiedName~StoreRegistryTests.PersistSourceSnapshot_WhenSaveFails|FullyQualifiedName~StoreRegistryTests.PersistMutations_TwoLockCoordinatedRegistriesLoadedBeforeWrites_RetainsAllUpdates|FullyQualifiedName~StoreStateSerializerTests"

      - name: Run lock-held state refresh and snapshot tests
        run: dotnet test test/Nuplane.Runtime.Tests/Nuplane.Runtime.Tests.csproj --configuration Release --filter "FullyQualifiedName~DesiredSourceSnapshotCacheTests.SaveAsync_WhenRegistryPersistenceFails|FullyQualifiedName~ReconciliationServiceStoreLockTests.TriggerAsync_WhenAnotherRegistryUpdatesState_RefreshesStateAndSnapshotBeforeSourceFallback|FullyQualifiedName~LastKnownGoodStartupRecoveryServiceStoreLockTests.TryRecoverAsync_WhenAnotherRegistryUpdatesLoadedState_UsesRefreshedLastKnownGoodVersion"

      - name: Run native Unix store adapter and identity tests
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" && "$(uname -m)" != "arm64" ]]; then
            echo "The native Unix store adapter qualification requires a macOS arm64 runner."
            exit 1
          fi
          if [[ "${{ matrix.os }}" == "ubuntu-24.04-arm" && "$(uname -m)" != "aarch64" ]]; then
            echo "The Linux arm64 lane must execute natively on arm64."
            exit 1
          fi

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            native_shim=$(find test/Nuplane.Store.Tests/bin/Release -type f -name libnuplane_store_native.dylib -print -quit)
            if [[ -z "${native_shim}" ]]; then
              echo "The project-reference build did not copy libnuplane_store_native.dylib to the Store test output."
              exit 1
            fi
          fi

          dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj \
            --configuration Release \
            --filter "(FullyQualifiedName~Nuplane.Store.Tests.Coordination.UnixPhysicalStoreFileSystemTests|FullyQualifiedName~Nuplane.Store.Tests.Coordination.UnixPhysicalStoreIdentityTests|FullyQualifiedName~Nuplane.Store.Tests.Coordination.UnixPhysicalStorePublicationTests)&FullyQualifiedName!~Ext4Casefold" \
            --logger "trx;LogFileName=native-unix.trx" \
            --results-directory "$RUNNER_TEMP/native-unix-results"

          python3 - "$RUNNER_TEMP/native-unix-results/native-unix.trx" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          counters = root.find('.//{*}Counters')
          if counters is None:
              raise SystemExit('Native qualification returned no test counters.')
          total = int(counters.get('total', '0'))
          passed = int(counters.get('passed', '0'))
          if total < 19 or passed != total:
              raise SystemExit(f'Native qualification requires every test to pass without skips: {counters.attrib}')
          names = {r.get('testName') for r in root.findall('.//{*}UnitTestResult') if r.get('outcome') == 'Passed'}
          required = {
              'NativeChildOpen_RefusesFinalLinksWithoutManagedPreInspection',
              'ObserveStateSlot_UsesFilesystemSpellingAndNameProfileForAliases',
              'ObserveStateSlot_ParentAliasesConvergeAndAtomicReplacePreservesSlot',
              'ObserveCanonicalFileNameNoFollow_RejectsWrongIdentityLinksAndForeignHandles',
              'NativeNoReplace_RefusesOccupiedTargetWithoutManagedPreInspection',
              'Publish_ReplacesExistingSlotAndPreservesItsIdentity',
              'Remove_RequiresExactRegularSingleLinkIdentity',
              'Publish_RefusesAliasSpellingForeignAndClosedParents',
          }
          if not all(any(n.endswith('.' + expected) for n in names) for expected in required):
              raise SystemExit('The Unix state-slot identity scenarios did not all execute and pass.')
          PY

      - name: Qualify ext4 casefold aliases on an owned loopback filesystem
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          set -euo pipefail
          owned_root=$(mktemp -d "$RUNNER_TEMP/nuplane-casefold.XXXXXX")
          image="$owned_root/store.ext4"
          mount_root="$owned_root/mount"
          mkdir "$mount_root"
          cleanup() {
            if mountpoint -q "$mount_root"; then
              sudo umount "$mount_root"
            fi
          }
          trap cleanup EXIT
          truncate -s 256M "$image"
          mkfs.ext4 -q -F -O casefold -E encoding=utf8-12.1 "$image"
          sudo mount -o loop,nosuid,nodev,noexec "$image" "$mount_root"
          sudo chown "$(id -u):$(id -g)" "$mount_root"
          TMPDIR="$mount_root" NUPLANE_REQUIRE_EXT4_CASEFOLD=1 \
            dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj \
            --configuration Release --no-build --no-restore \
            --filter "FullyQualifiedName~UnixPhysicalStoreIdentityTests.ObserveStateSlot_Ext4Casefold|FullyQualifiedName~UnixPhysicalStorePublicationTests.Publish_Ext4CasefoldAliasesRequireCanonicalNames|FullyQualifiedName~UnixPhysicalStoreDirectoryPublicationTests.Publish_Ext4CasefoldAliasIsObservedButOnlyCanonicalNameCanMove|FullyQualifiedName~RootMembershipBindingTests.BindDeclaredMembersAsync_Ext4CasefoldAliasPublishesObservedCanonicalSpelling" \
            --logger "trx;LogFileName=casefold.trx" \
            --results-directory "$RUNNER_TEMP/casefold-results"
          python3 - "$RUNNER_TEMP/casefold-results/casefold.trx" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          rows = root.findall('.//{*}UnitTestResult')
          required = {'ObserveStateSlot_Ext4CasefoldResolvesCaseAndNormalizationAliases', 'Publish_Ext4CasefoldAliasesRequireCanonicalNames', 'Publish_Ext4CasefoldAliasIsObservedButOnlyCanonicalNameCanMove', 'BindDeclaredMembersAsync_Ext4CasefoldAliasPublishesObservedCanonicalSpelling'}
          if len(rows) != 4 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('All four required native ext4 casefold scenarios must execute and pass without skips.')
          if not all(any(row.get('testName', '').endswith('.' + name) for row in rows) for name in required):
              raise SystemExit('The required ext4 casefold identity/file/directory publication/binding scenarios did not all execute.')
          PY

      - name: Run native Windows store adapter tests on Windows x64 NTFS
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') {
            throw 'Native Windows store qualification requires a Windows x64 runner.'
          }
          $temporaryDrive = [System.IO.DriveInfo]::new([System.IO.Path]::GetPathRoot([System.IO.Path]::GetTempPath()))
          if ($temporaryDrive.DriveFormat -ne 'NTFS') {
            throw 'Native Windows store qualification requires the owned test temporary root to reside on NTFS.'
          }

          $results = Join-Path $env:RUNNER_TEMP 'native-windows-results'
          dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj `
            --configuration Release `
            --filter 'FullyQualifiedName~Nuplane.Store.Tests.Coordination.WindowsPhysicalStoreFileSystemTests|FullyQualifiedName~Nuplane.Store.Tests.Coordination.WindowsPhysicalStorePublicationTests|FullyQualifiedName~Nuplane.Store.Tests.Coordination.WindowsReparseTargetParserTests' `
            --logger 'trx;LogFileName=native-windows.trx' `
            --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          [xml]$report = Get-Content (Join-Path $results 'native-windows.trx') -Raw
          $counters = $report.SelectSingleNode('//*[local-name()="Counters"]')
          if ($null -eq $counters) { throw 'Native Windows qualification returned no test counters.' }
          $total = [int]$counters.total
          $passed = [int]$counters.passed
          if ($total -lt 19 -or $passed -ne $total) {
            throw "Native Windows qualification requires every test to pass without skips: $($counters.OuterXml)"
          }
          $rows = @($report.SelectNodes('//*[local-name()="UnitTestResult"]'))
          foreach ($name in @(
            'NativeNoReplace_RefusesOccupiedTargetWithoutManagedPreInspection',
            'Publish_ReplacesExistingSlotAndPreservesItsIdentity',
            'Remove_RequiresExactRegularSingleLinkIdentity',
            'Publish_RefusesAliasSpellingForeignAndClosedParents'
          )) {
            $matched = @($rows | Where-Object { $_.testName.EndsWith('.' + $name) -and $_.outcome -eq 'Passed' })
            if ($matched.Count -ne 1) { throw "The required native publication scenario did not execute and pass: $name" }
          }

      - name: Run native Windows state-slot identity tests
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = Join-Path $env:RUNNER_TEMP 'identity-windows-results'
          dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj `
            --configuration Release `
            --filter 'FullyQualifiedName~Nuplane.Store.Tests.Coordination.WindowsPhysicalStoreIdentityTests' `
            --logger 'trx;LogFileName=identity-windows.trx' `
            --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          [xml]$report = Get-Content (Join-Path $results 'identity-windows.trx') -Raw
          $rows = @($report.SelectNodes('//*[local-name()="UnitTestResult"]'))
          $required = @(
            'StateSlotObservation_UsesStoredCaseAndNativeCaseInsensitiveProfile',
            'StateSlotObservation_CaseSensitiveDirectoryKeepsCaseVariantsDistinct',
            'StateSlotObservation_RefusesWrongIdentityReparseAndHardLinkEntries',
            'CanonicalNameObservation_RequiresTheOwnedParentHandleToRemainOpen',
            'StateSlotObservation_AtomicReplacementKeepsSlotButChangesFileIdentityAndRenameChangesSlot'
          )
          foreach ($name in $required) {
            $matched = @($rows | Where-Object { $_.testName.EndsWith('.' + $name) -and $_.outcome -eq 'Passed' })
            if ($matched.Count -ne 1) { throw "The required native identity scenario did not execute and pass: $name" }
          }
          $aliasName = '.StateSlotObservation_8Dot3AliasResolvesToTheStoredLongBasenameWhenEnabled'
          $alias = @($rows | Where-Object { $_.testName.EndsWith($aliasName) })
          if ($alias.Count -ne 1 -or $alias[0].outcome -notin @('Passed', 'NotExecuted')) {
            throw 'The 8.3 alias scenario must either pass or report an explicit capability skip.'
          }
          if (@($rows | Where-Object { $_.outcome -ne 'Passed' -and -not $_.testName.EndsWith($aliasName) }).Count -ne 0) {
            throw 'Only the optional 8.3 alias capability scenario may be skipped.'
          }
          if ($alias[0].outcome -eq 'NotExecuted') {
            Write-Host '8.3 aliases are unavailable on this test volume; that scenario remains unqualified.'
          }

  build-test:
    needs:
      - darwin-native-shim
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download verified Darwin native shim
        uses: actions/download-artifact@v4
        with:
          name: nuplane-darwin-native
          path: ${{ github.workspace }}/artifacts/nuplane-darwin-native

      - name: Set Darwin native shim directory for project-reference builds
        shell: bash
        run: echo "NuplaneDarwinNativeDirectory=$GITHUB_WORKSPACE/artifacts/nuplane-darwin-native" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore nuplane.sln

      - name: Build
        run: dotnet build nuplane.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test nuplane.sln --configuration Release --no-restore --no-build

      - name: Verify Darwin assets survive Linux packaging
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/Nuplane/Nuplane.csproj --configuration Release --no-build \
            -p:PackageVersion=0.0.0-ci.native --output artifacts/validation-packages
          python3 - <<'PY'
          import hashlib
          import pathlib
          import zipfile
          source = pathlib.Path('artifacts/nuplane-darwin-native/libnuplane_store_native.dylib')
          expected = hashlib.sha256(source.read_bytes()).digest()
          package = pathlib.Path('artifacts/validation-packages/Nuplane.0.0.0-ci.native.nupkg')
          with zipfile.ZipFile(package) as archive:
              for rid in ('osx-arm64', 'osx-x64'):
                  asset = f'runtimes/{rid}/native/libnuplane_store_native.dylib'
                  if hashlib.sha256(archive.read(asset)).digest() != expected:
                      raise SystemExit(f'Packaged native asset differs: {asset}')
          PY
