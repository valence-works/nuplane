          rows = ET.parse(sys.argv[1]).findall('.//{*}UnitTestResult')
          if len(rows) != 33 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('All 28 publisher cases, recovery restart case and four gate cases must pass without skips.')
          publisher = [r.get('testName', '') for r in rows if '.PublisherProcess_CheckpointsRecoverOrPreserveExactEvidenceAcrossAllPriorBindings(' in r.get('testName', '')]
