          points = ['PendingPublished', 'StageFlushed', 'BackupFlushed', 'ArtifactsBound', 'StatePublished',
                    'StateVerified', 'ResolutionPublished', 'BackupRemoved', 'ArtifactsRemoved', 'Acknowledged']
          pairs = [re.findall(r'"([^"]+)"', name)[:2] for name in publisher]
          if len(publisher) != 28:
              raise SystemExit('The actual publisher checkpoint matrix did not execute all 28 cases.')
          for shape in shapes:
              for point in points:
                  if shape == 'Prospective' and point in ['BackupFlushed', 'BackupRemoved']:
                      continue
                  if pairs.count([shape, point]) != 1:
                      raise SystemExit('Missing or duplicate publisher case: ' + shape + '/' + point)
          required = ['RecoveryProcesses_CrashAfterPriorStageAndNextBackupRemoval_ResumeWithFreshOwner',
