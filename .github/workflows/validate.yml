name: Validate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  darwin-native-shim:
    name: Build universal Darwin store shim
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build and verify universal native shim
        shell: bash
        run: bash native/nuplane-store/build-darwin.sh "$RUNNER_TEMP/nuplane-darwin-native"

      - name: Upload verified native shim
        uses: actions/upload-artifact@v4
        with:
          name: nuplane-darwin-native
          path: |
            ${{ runner.temp }}/nuplane-darwin-native/libnuplane_store_native.dylib
            ${{ runner.temp }}/nuplane-darwin-native/nuplane-store-native.manifest.json
          if-no-files-found: error

  state-persistence-platform:
    name: State persistence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Verify protection serialization and canonical digests on every supported framework
        shell: bash
        run: |
          set -euo pipefail
          for framework in net8.0 net9.0 net10.0; do
            dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj \
              --configuration Release -p:NuplaneProtectionFrameworkMatrix=true --framework "$framework" \
              --filter "FullyQualifiedName~GraphUsePayloadSerializerTests|FullyQualifiedName~ProtectionStateSerializationTests|FullyQualifiedName~ProtectionStatePayloadSerializerTests|FullyQualifiedName~ProtectionDigestTests|FullyQualifiedName~RootMembershipPayloadSerializerTests|FullyQualifiedName~PersistedStoreStateGraphVerifierTests" \
              --logger "trx;LogFileName=protection-$framework.trx" \
              --results-directory "$RUNNER_TEMP/protection-results/$framework"
            python3 - "$RUNNER_TEMP/protection-results/$framework/protection-$framework.trx" <<'GRAPHUSE'
          import collections
          import sys
          import xml.etree.ElementTree as ET
          rows = ET.parse(sys.argv[1]).findall('.//{*}UnitTestResult')
          required = [
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Constructor_RejectsGraphInstallOnAnotherNativeVolume',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Constructor_RequiresRootMembershipAndNativeVolumeAgreement',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsDigestTamperingTruncationAndOversize',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsDuplicatePropertiesAtEveryDepth',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsMissingNestedFieldsAndNullRequiredValues',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsMissingRequiredFields(property: "diagnosticProcessId")',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsMissingRequiredFields(property: "enrollmentEpoch")',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsMissingRequiredFields(property: "graphSnapshot")',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsMissingRequiredFields(property: "lifetimeKind")',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsMissingRequiredFields(property: "payloadDigest")',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsMissingRequiredFields(property: "rootIdentity")',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsMissingRequiredFields(property: "schemaVersion")',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsMissingRequiredFields(property: "sentinelIdentity")',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsMissingRequiredFields(property: "snapshotState")',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsMissingRequiredFields(property: "useId")',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsUnknownAndCaseMismatchedProperties',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsUnsupportedOrInvalidScalarValues(property: "diagnosticProcessId", value: 0)',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsUnsupportedOrInvalidScalarValues(property: "lifetimeKind", value: 2)',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsUnsupportedOrInvalidScalarValues(property: "schemaVersion", value: 2)',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Deserialize_RejectsUnsupportedOrInvalidScalarValues(property: "snapshotState", value: 99)',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Digest_BindsEveryVariableRecordField',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.GraphDigest_IsIndependentOfSetInputOrder',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.GraphDigest_MatchesIndependentRevisionOneGoldenVector',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.RoundTrip_PreservesCandidateAndCopiesTheFullGraph',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Serialize_RejectsCandidateWithMismatchedDigest',
              'Nuplane.Store.Tests.Coordination.GraphUsePayloadSerializerTests.Serialize_RejectsPayloadLargerThanBound',
          ]
          codec_rows = [row for row in rows if '.GraphUsePayloadSerializerTests.' in row.attrib['testName']]
          if collections.Counter(row.attrib['testName'] for row in codec_rows) != collections.Counter(required):
              raise SystemExit('graph-use-record-codec: required scenario names or multiplicity differ.')
          legacy_classes = {
              'Nuplane.Store.Tests.State.ProtectionStateSerializationTests': 29,
              'Nuplane.Store.Tests.State.ProtectionStatePayloadSerializerTests': 7,
              'Nuplane.Store.Tests.Coordination.ProtectionDigestTests': 28,
              'Nuplane.Store.Tests.Coordination.RootMembershipPayloadSerializerTests': 23,
              'Nuplane.Store.Tests.Coordination.PersistedStoreStateGraphVerifierTests': 10,
          }
          legacy_rows = [row for row in rows if row not in codec_rows]
          observed_classes = collections.Counter(row.attrib['testName'].split('(', 1)[0].rsplit('.', 1)[0] for row in legacy_rows)
          if observed_classes != collections.Counter(legacy_classes):
              raise SystemExit('Existing serialization/digest suites must retain their required scenario counts.')
          if len({row.attrib['testName'] for row in rows}) != len(rows):
              raise SystemExit('Serialization/digest scenario names must be unique.')
          if len(rows) != 123 or any(row.attrib.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('All 26 graph-use codec and 97 existing serialization/digest cases must pass without skips.')
          print('Qualified all 26 graph-use codec and 97 existing serialization/digest cases with no skips.')
          GRAPHUSE
          done

      - name: Run coordinated native ledger publication and recovery tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj \
            --configuration Release --framework net10.0 \
            --filter "FullyQualifiedName~RootMembershipRegistryTests|FullyQualifiedName~PhysicalStoreLockTests|FullyQualifiedName~PhysicalStoreLockOrderingTests" \
            --logger "trx;LogFileName=coordinated-publication.trx" \
            --results-directory "$RUNNER_TEMP/coordinated-publication"
          python3 - "$RUNNER_TEMP/coordinated-publication/coordinated-publication.trx" <<'PYCODE'
          import sys
          import xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          rows = ET.parse(sys.argv[1]).findall('.//t:UnitTestResult', ns)
          required = [
              'PublishStateAsync_AllPriorBranches_ReopensActualNativePayloadAndAcknowledgesNewIdentity',
              'RecoverAsync_DurablePendingBeforeArtifacts_ExactPriorRollsBackAndRemainsIncomplete',
              'RecoverAsync_BoundArtifactsBeforeReplacement_ExactPriorRollsBackAndRemovesOnlyBoundFiles',
              'RecoverAsync_ReplacedAndVerifiedSeams_ExactNextAcknowledgesReopenedStagedIdentity',
              'RecoverAsync_UnboundArtifactOrChangedBoundBackup_RefusesAndPreservesPendingEvidence',
              'RecoverAsync_ThirdOrMissingState_RefusesWithoutChangingLedgerOrArtifacts',
              'RecoverAsync_CompletePrior_RestoresStatusOnlyAfterEveryMemberReopensCorrectly',
              'PublishStateAsync_AnotherMembersMissingStateOrParent_RefusesBeforePendingPublication',
              'PublishStateAsync_SerializerDropsProtectionOnActualStageReopen_PreservesPendingAndPrior',
              'PublishStateAsync_DurableResolutionAndCleanupSeams_RecoverWithoutUnreferencedBackups',
              'RecoverAsync_PriorCleanupInterruptedBetweenRemovals_ResumesExactPriorAndRetainsSibling',
              'RecoverAsync_UnresolvedMissingBoundArtifact_RefusesBeforeDurableCleanupSelection',
              'RecoverAsync_ResolvedPriorChangedStageOrBackup_ValidatesAllArtifactsBeforeAnyRemoval',
              'RecoverAsync_ResolvedNextChangedStateOrSibling_RefusesAndKeepsBackup',
              'PublishStateAsync_CompletePrior_AcknowledgesOnlyAfterCleanupAndAllMembersValidate',
              'RecoverAsync_BackupChangesAfterStageRemoval_RevalidatesPayloadBeforeRemovingBackup',
              'RecoverAsync_CancelAfterFirstRemoval_RetainsDurableResolutionForFreshRecovery',
              'RecoverAsync_SelectedStateChangesAfterStageRemoval_RetainsExactPriorBackup',
              'AcquireAsync_SortsMemberLocksAndReleasesInReverseOrder',
              'AcquireAsync_CancellationAfterFirstMemberUnwindsAndLeavesEveryLockReusable',
              'AcquireBootstrapAsync_PreparesUnderRootCreatesMissingLocksAndAcquiresSorted',
              'AcquireBootstrapAsync_BusyLaterMemberUnwindsAndRetryReusesProvisionedLockFiles',
              'AcquireBootstrapAsync_CancellationAfterFirstMemberUnwindsAndRetryReusesCreatedLocks',
              'AcquireBootstrapAsync_CallbackFailureReleasesRootWithoutProvisioningMembers',
              'AcquireBootstrapAsync_CallbackCancellationReleasesRootWithoutProvisioningMembers',
              'AcquireBootstrapAsync_DuplicatePreparedSlotsFailBeforeMemberProvisioning',
              'QuiescentBoundContext_PublishesTwiceUnderOneOwnerAndRefreshesEveryLocation',
              'QuiescentBoundContext_InterruptedPendingExpiresLocationsAndCompleteReplayRefusesBeforeStateRead',
          ]
          if len(rows) < 39 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('Coordinated native publication/lock scenarios must execute without skips.')
          for name in required:
              if sum(row.get('testName', '').endswith('.' + name) for row in rows) != 1:
                  raise SystemExit('Missing coordinated scenario: ' + name)
          PYCODE

      - name: Qualify initial incomplete declaration and native prospective-slot profiles
        shell: bash
        run: |
          set -euo pipefail
          dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj \
            --configuration Release --framework net10.0 \
            --filter "FullyQualifiedName~RootMembershipInitializationTests|FullyQualifiedName~PhysicalStoreDirectoryNameSemanticsTests" \
            --logger "trx;LogFileName=initial-declaration.trx" \
            --results-directory "$RUNNER_TEMP/initial-declaration"
          python3 - "$RUNNER_TEMP/initial-declaration/initial-declaration.trx" <<'PYCODE'
          import sys
          import xml.etree.ElementTree as ET
          rows = ET.parse(sys.argv[1]).findall('.//{*}UnitTestResult')
          required = [
              'Observe_EmptyParentCreatesNothingAndMatchesCanonicalFileObservation',
              'Observe_RejectsForeignAndClosedParentHandles',
              'InitializeIncomplete_PublishesEveryDeclaredTargetAndRootLockBeforeMemberStateIo',
              'InitializeIncomplete_PreconditionRefusalDoesNotMutateTheRootOrMemberStateParents',
              'InitializeIncomplete_PresentFinalWithMissingLedgerIsPreserved',
              'InitializeIncomplete_PresentFinalWithMalformedLedgerIsPreserved',
              'InitializeIncomplete_CancellationOrFaultBeforeMoveRetainsStageAndLeavesFinalAbsent',
              'InitializeIncomplete_ExceptionAfterMoveLeavesExactValidIncompleteDeclaration',
              'InitializeIncomplete_CompetingPublishersCannotOverwriteWinnerAndRetainLosingStage',
          ]
          if len(rows) != 9 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('All nine initial declaration/profile scenarios must execute and pass without skips.')
          for name in required:
              if sum(row.get('testName', '').endswith('.' + name) for row in rows) != 1:
                  raise SystemExit('Missing initial declaration/profile scenario: ' + name)
          PYCODE

      - name: Qualify incomplete declared-member binding before state payload reads
        shell: bash
        run: |
          set -euo pipefail
          dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj \
            --configuration Release --framework net10.0 \
            --filter "FullyQualifiedName~RootMembershipBindingTests&FullyQualifiedName!~Ext4Casefold" \
            --logger "trx;LogFileName=declared-member-binding.trx" \
            --results-directory "$RUNNER_TEMP/declared-member-binding"
          python3 - "$RUNNER_TEMP/declared-member-binding/declared-member-binding.trx" <<'PYCODE'
          import sys
          import xml.etree.ElementTree as ET
          rows = ET.parse(sys.argv[1]).findall('.//{*}UnitTestResult')
          required = [
              'BindDeclaredMembersAsync_BindsOrderedUnionAfterLocksAndPreservesStateSlots',
              'BindDeclaredMembersAsync_PreconditionMismatchesPreserveDeclaration',
              'BindDeclaredMembersAsync_DuplicateActualSlotsRefuseBeforeMemberLockProvisioning',
              'BindDeclaredMembersAsync_ProtectedOrMalformedPriorStateRemainsDeclared',
              'BindDeclaredMembersAsync_RereadsLedgerAfterAllLocksBeforeDecodingMemberPayload',
              'BindDeclaredMembersAsync_StateReplacementAfterAllLocksRefusesBeforePayloadDecode',
              'BindDeclaredMembersAsync_FaultOrCancellationBeforePublishLeavesAllMembersDeclared',
              'BindDeclaredMembersAsync_ExceptionAfterPublicationLeavesWholeBoundUnionIncomplete',
              'BindDeclaredMembersAsync_BusyLastSortedMemberLockRefusesAndCanRetry',
              'BindDeclaredMembersAsync_DoesNotAdoptDigestValidMismatchedOrAlreadyBoundLedger',
          ]
          if len(rows) != 10 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('All ten incomplete binding scenarios must execute and pass without skips.')
          for name in required:
              if sum(row.get('testName', '').endswith('.' + name) for row in rows) != 1:
                  raise SystemExit('Missing or duplicate incomplete binding scenario: ' + name)
          PYCODE

      - name: Qualify metadata-only configured store authority resolution
        shell: bash
        run: |
          set -euo pipefail
          dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj \
            --configuration Release --framework net10.0 \
            --filter "FullyQualifiedName~PackageStoreAuthorityResolverTests&FullyQualifiedName!~Ext4Casefold" \
            --logger "trx;LogFileName=configured-authority.trx" \
            --results-directory "$RUNNER_TEMP/configured-authority"
          python3 - "$RUNNER_TEMP/configured-authority/configured-authority.trx" <<'PYCODE'
          import sys
          import xml.etree.ElementTree as ET
          rows = ET.parse(sys.argv[1]).findall('.//{*}UnitTestResult')
          required = [
              'Resolve_UnenrolledDirectoryAndArchive_ReplaysAbsoluteAndExplicitBaseComponents',
              'Resolve_MissingTargetsAndInvalidBaseForms_RefuseWithoutFilesystemSideEffects',
              'Resolve_ConfiguredRootAliasesAbsoluteAndRelative_ConvergeOnNativeRootIdentity',
              'Resolve_RequiredRootWithParentComponentsBeforeAuthority_ReplaysWithoutInventingAnEarlierBoundary',
              'Resolve_FinalPackageAndArchiveLinksOrHardlinks_RefusesWithoutReadingPayload',
              'Resolve_InspectsReservedAuthorityBeforeFollowingAnEscapingAlias',
              'Resolve_NestedDifferentAndEscapeThenReturnAuthorities_Refuses',
              'Resolve_PresentMissingMalformedOrIncompleteControlNamespace_IsTypedUnknown',
              'Resolve_ReservedControlOrMembershipLedgerLinksAreNeverAuthority',
              'Revalidate_RejectsIdenticalLedgerBytesPublishedWithANewNativeIdentity',
              'Resolve_AliasOrDirectoryEdgeReplacementDuringReplay_RefusesAndClosesOwnedHandles',
              'Revalidate_DetectsNewAuthorityReplacedDirectoryAndChangedAlias',
              'Revalidate_AfterResultDisposal_RefusesExpiredEvidence',
          ]
          if len(rows) != 13 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('All thirteen configured authority scenarios must execute and pass without skips.')
          for name in required:
              if sum(row.get('testName', '').endswith('.' + name) for row in rows) != 1:
                  raise SystemExit('Missing or duplicate configured authority scenario: ' + name)
          PYCODE

      - name: Qualify locked member locations and completed install graph snapshots
        shell: bash
        run: |
          set -euo pipefail
          dotnet test test/Nuplane.Store.Tests/Nuplane.Store.Tests.csproj \
            --configuration Release --framework net10.0 \
            --filter "FullyQualifiedName~RootMembershipLocatorReplayTests|FullyQualifiedName~PackageInstallIdentityReaderTests|FullyQualifiedName~CreateCandidate_ActualDependencyGraphAndNativeInstallsSurvivePayloadRoundTrip|FullyQualifiedName~RootMembershipProtectionVerificationTests|FullyQualifiedName~PackageStoreAdmissionTests|FullyQualifiedName~PackageStoreAdmissionRefusalTests|FullyQualifiedName~PackageStoreAdmissionOrderingTests|FullyQualifiedName~CoordinatedStoreRegistryTests|FullyQualifiedName~PackageStoreAdmissionProspectiveRootTests" \
            --logger "trx;LogFileName=member-install.trx" \
            --results-directory "$RUNNER_TEMP/member-install"
          python3 - "$RUNNER_TEMP/member-install/member-install.trx" "${{ runner.os }}" <<'PYCODE'
          import sys
          import xml.etree.ElementTree as ET
          rows = ET.parse(sys.argv[1]).findall('.//{*}UnitTestResult')
          required = ['Observe_UsesHeldNativeDirectoriesAndEmptySingleLinkMarkerWithoutContentOrMutationIO', 'Observe_RejectsMissingNonemptyAndHardLinkedCompletionMarkers', 'Observe_RejectsLinkedDirectoryComponentsAndLinkedCompletionMarker', 'Observe_RejectsWrongRootAndForeignFilesystemHandles', 'Observe_RejectsRootLevelControlAndStagingDirectories', 'Observe_RefusesAnUnknownNativeNameProfile', 'WithQuiescentIncompleteMemberLocationsAsync_ReplaysExternalAndSameRootProspectiveSlotsWithoutPayloadReads', 'WithCompleteMemberLocationsAsync_ReplaysParentAliasAndUsesOnlyExistingBoundLocks', 'WithCompleteMemberLocationsAsync_RefusesFinalFileLinksAndHardlinksBeforeCallback', 'WithCompleteMemberLocationsAsync_ChangedLedgerAndStateSlotRefuseBeforeCallback', 'WithQuiescentIncompleteMemberLocationsAsync_RequiresQuiescenceAndAbsoluteHints', 'Revalidate_ExternalMemberLocatorRejectsLedgerChangedInsideCallback', 'WithCompleteMemberLocationsAsync_MissingBoundLockIsRefusedWithoutRecreation', 'WithQuiescentIncompleteMemberLocationsAsync_DuplicateNativeSlotsRefuseBeforeMemberLockProvisioning', 'WithCompleteMemberLocationsAsync_ParentAliasThroughDifferentAuthorityRefusesBeforeCallback', 'CreateCandidate_ActualDependencyGraphAndNativeInstallsSurvivePayloadRoundTrip', 'WithQuiescentIncompleteMemberLocationsAsync_DeclaredMemberStateReadRefusesBeforePayloadRead', 'WithCompleteMemberLocationsAsync_ReadsExactBoundStateOnlyInsideTheCallback', 'CompleteEnrollment_ActualTwoStateGraphsPublishAndReopenBeforeComplete', 'CompleteEnrollment_RejectsChangedNativeInstallWrongDescriptorAndUnknownLegacyRecovery', 'CompleteEnrollment_RejectsDigestValidStateWithUnselectedGraphVersions', 'CompleteEnrollment_RequiresQuiescenceAndEveryActualAcknowledgedState', 'ConfiguredRootAdmissionRetainsVerifiedLocksUntilBorrowDrains', 'MultiPathAdmissionDeduplicatesRootAliasesAndRestrictsEachBorrowToItsExactPath', 'MultiRootAdmissionHoldsEveryVerifiedMemberSetAndDrainsBeforeUnlock', 'MultiRootRefusalUnwindsEarlierRootWhenLaterSortedRootIsBusy', 'ArchivePathsRequireSingleNativeFileIdentityWithoutArchivePayloadReads', 'PostResolutionTargetInspectionFaultClosesTheUntransferredNativeResolution', 'PartialMultiRootUnwindReportsBothAdmissionAndNativeReleaseFailures', 'FailedNativeOwnerReleaseRemainsVisibleOnRepeatedDisposal', 'UnenrolledConfiguredRootIsOnlyReturnedAfterPositiveNativeAbsenceObservation', 'IncompleteEnrollmentRefusesRootAndPathAdmission', 'BothAdmissionPathsRefuseDigestValidSemanticallyInvalidCompleteStateAndUnwind', 'BothAdmissionPathsRefuseReplacedNativeCompletionMarkerIdentityAndUnwind', 'BothAdmissionPathsRefuseReplacedNativeInstallDirectoryIdentityAndUnwind', 'MultiRootAdmissionHoldsEveryRootAndMemberLockBeforeFirstMemberPayloadRead', 'CancellationWhileAcquiringLaterRootReleasesEarlierRootAndMemberLocks', 'CoordinatedStateReadAndThreePublicationsUseOneExistingOwnerAcrossTwoMembers', 'UnlistedConfiguredSlotRefusesBeforeAnyMemberPayloadReadOrWrite', 'DifferentEligibleSerializerRefusesBeforeAnyMemberPayloadReadOrWrite', 'UnknownCompleteCandidateRefusesBeforePublication', 'IncoherentCurrentMemberRefusesBeforeAnyPublication', 'ExpiredBorrowAndUnsupportedSerializerRefuseBeforePayloadRead', 'CoordinatedStateReadAndPublicationsRemainAvailableWithRetainedMultiPathAdmission', 'ConfiguredRootAdmissionAcceptsOnlyAnAbsentOrdinaryUnenrolledSuffix', 'ConfiguredRootAdmissionRefusesMissingSuffixBeneathObservedCompleteAuthority', 'ConfiguredRootAdmissionRefusesReservedControlNameAsFirstMissingEdge', 'ConfiguredRootAdmissionRefusesReservedControlNameLaterInMissingSuffix', 'ConfiguredRootAdmissionUsesObservedNameProfileForReservedNameAlias', 'ConfiguredRootAdmissionDoesNotBroadenTheReservedNameMatchToPrefixes', 'ConfiguredRootAdmissionRefusesUnknownNativeNameProfileForMissingSuffix', 'ConfiguredRootAdmissionDoesNotGuessUnicodeReservedNameEquivalence', 'ConfiguredRootAdmissionRefusesNonAsciiLaterSuffixWithoutItsNativeProfile', 'ConfiguredRootAdmissionRefusesAliasEscapeFromCompleteAuthorityBeforeMissingSuffix', 'ConfiguredRootAdmissionRefusesMissingTargetInsideAnUnresolvedAliasExpansion', 'ConfiguredRootAdmissionRevalidatesMissingEdgeDuringInitialResolutionReplay', 'ConfiguredRootAdmissionRevalidatesMissingEdgeBeforeAdmissionReturns', 'MultiRootAdmissionAcquiresEveryRootBeforeFirstMemberAndIgnoresRequestOrder', 'MultiRootAdmission_LateMemberContentionUnwindsEveryAcquiredLock', 'MultiRootAdmission_LedgerMutationAfterAllRootsRefusesBeforeMemberLocks', 'MultiRootAdmission_PartialLocatorReplayFailureReleasesTheWholeLockUnion', 'MultiRootAdmission_ProfileMutationAfterAllRootsRefusesBeforeMemberLocks', 'MultiRootAdmission_SecondRootBusyUnwindsEarlierRootLock', 'MultiRootPathAdmissionRestrictsBorrowsAndRetainsUnionUntilDrainWithUnenrolledPath', 'PhysicalLockUnion_EqualStateSlotRetainsBothRootLocalMemberLocks', 'PhysicalLockUnion_RetainsLocksUntilEveryCountedRootOwnerDrains']
          if len(rows) != 76:
              raise SystemExit('All 76 member-location/install/producer/completion/admission scenarios must be discovered.')
          for name in required:
              matching = [row for row in rows if row.get('testName', '').endswith('.' + name)]
              if len(matching) != 1 or matching[0].get('outcome') != 'Passed':
                  raise SystemExit('Missing, duplicate, failed or skipped native member/install scenario: ' + name)
          theory = [row for row in rows if '.Observe_RejectsMalformedOrMismatchedPathHints(' in row.get('testName', '')]
          if len(theory) != 6 or len({row.get('testName') for row in theory}) != 6 or any(row.get('outcome') != 'Passed' for row in theory):
              raise SystemExit('All six malformed install path inputs must execute and pass uniquely.')
          conditional = {
              'ConfiguredRootAdmissionRefusesExt4CasefoldAliasOfReservedControlName': 'NotExecuted',
              'Observe_UsesNativeCasefoldProfileForReservedAliasesAndRetainsOrdinaryAliasSpelling': 'NotExecuted',
              'Revalidate_RefusesAnInstallRenamedIntoAReservedNativeAlias': 'NotExecuted',
              'Revalidate_RefusesReplacedInstallDirectoryAndCompletionMarker': 'NotExecuted' if sys.argv[2] == 'Windows' else 'Passed',
          }
          for name, outcome in conditional.items():
              matching = [row for row in rows if row.get('testName', '').endswith('.' + name)]
              if len(matching) != 1 or matching[0].get('outcome') != outcome:
                  raise SystemExit('Unexpected supported-platform outcome for ' + name)
          PYCODE

      - name: Qualify actual process incomplete member binding interruption
        shell: bash
        run: |
          set -euo pipefail
          dotnet test test/Nuplane.Integration.Tests/Nuplane.Integration.Tests.csproj \
            --configuration Release --framework net10.0 \
            --filter "FullyQualifiedName~RootMembershipBindingProcessTests" \
            --logger "trx;LogFileName=binding-process.trx" \
            --results-directory "$RUNNER_TEMP/binding-process"
          python3 - "$RUNNER_TEMP/binding-process/binding-process.trx" <<'PYCODE'
          import sys
          import re
          import xml.etree.ElementTree as ET
          rows = ET.parse(sys.argv[1]).findall('.//{*}UnitTestResult')
          if len(rows) != 2 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('Both incomplete binding process interruption cases must execute and pass without skips.')
          for point in ['BindingsPrepared', 'BoundLedgerPublished']:
              matches = [row for row in rows
                         if '.BindProcess_TerminationPreservesDeclaredOrWholeBoundIncompleteLedger(' in row.get('testName', '')
                         and re.findall(r'"([^"]+)"', row.get('testName', '')) == [point]]
              if len(matches) != 1:
                  raise SystemExit('Missing or duplicate incomplete binding process checkpoint: ' + point)
          PYCODE

      - name: Qualify actual process initial declaration interruption
        shell: bash
        run: |
          set -euo pipefail
          dotnet test test/Nuplane.Integration.Tests/Nuplane.Integration.Tests.csproj \
            --configuration Release --framework net10.0 \
            --filter "FullyQualifiedName~RootMembershipInitializationProcessTests" \
            --logger "trx;LogFileName=initial-declaration-process.trx" \
            --results-directory "$RUNNER_TEMP/initial-declaration-process"
          python3 - "$RUNNER_TEMP/initial-declaration-process/initial-declaration-process.trx" <<'PYCODE'
          import sys
          import re
          import xml.etree.ElementTree as ET
          rows = ET.parse(sys.argv[1]).findall('.//{*}UnitTestResult')
          if len(rows) != 2 or any(row.get('outcome') != 'Passed' for row in rows):
              raise SystemExit('Both initial declaration process interruption cases must execute and pass without skips.')
          for point in ['DeclarationPrepared', 'ControlPublished']:
              matches = [row for row in rows
                         if '.InitializeProcess_TerminationLeavesAbsentFinalOrExactIncompleteDeclaration(' in row.get('testName', '')
                         and re.findall(r'"([^"]+)"', row.get('testName', '')) == [point]]
              if len(matches) != 1:
                  raise SystemExit('Missing or duplicate initial declaration process checkpoint: ' + point)
          PYCODE

      - name: Qualify actual process publication and cleanup recovery
        shell: bash
        run: |
          set -euo pipefail
          dotnet test test/Nuplane.Integration.Tests/Nuplane.Integration.Tests.csproj \
            --configuration Release --framework net10.0 \
            --filter "FullyQualifiedName~RootMembershipRegistryProcessTests|FullyQualifiedName~PackageStoreParticipantProcessTests" \
            --logger "trx;LogFileName=membership-process.trx" \
            --results-directory "$RUNNER_TEMP/membership-process"
